<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Galaxia 3D 🌌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{overflow:hidden;background:#000;font-family:'Georgia',serif}
canvas{position:fixed;top:0;left:0;z-index:1}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 2s ease;pointer-events:none}
#loading.hidden{opacity:0}
#loadTitle{color:#fff;font-size:24px;text-shadow:0 0 20px #7c4dff;margin-bottom:15px;animation:pulseLoad 1.5s ease-in-out infinite}
#loadBar{width:200px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#loadBarFill{height:100%;background:linear-gradient(90deg,#7c4dff,#ff6ec7);width:0%;transition:width .3s ease;border-radius:3px}
@keyframes pulseLoad{0%,100%{opacity:.5}50%{opacity:1}}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;color:rgba(255,255,255,.4);font-size:12px;pointer-events:none;text-align:center;transition:opacity 2s}
#title{text-align:center;position:fixed;top:5%;left:0;width:100%;z-index:5;color:#fff;font-size:22px;font-weight:bold;text-shadow:0 0 20px #b388ff,0 0 40px #7c4dff;animation:pulseT 4s ease-in-out infinite;pointer-events:none}
@keyframes pulseT{0%,100%{opacity:.6}50%{opacity:1}}
</style>
</head>
<body>
<div id="loading"><div id="loadTitle">🌌 Creando Galaxia...</div><div id="loadBar"><div id="loadBarFill"></div></div></div>
<div id="title">🌌 GALAXIA 3D 🌌</div>
<div id="info">Arrastra para rotar • Scroll/Pinch para zoom • Toca una estrella ✨</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== CONFIG =====
var STAR_COUNT = isMobile() ? 15000 : 40000;
var NEBULA_COUNT = isMobile() ? 6 : 12;
var SHOOTING_STAR_INTERVAL = 3000 + Math.random()*5000;
var BRANCHES = 4;

function isMobile(){return /Android|iPhone|iPad/i.test(navigator.userAgent);}

// ===== SCENE SETUP =====
var scene,camera,renderer,clock;
var galaxyPoints,nebulaMeshes=[],dustParticles,floatingParticles=[];
var blackHoleDisk,blackHoleCore,glowSprite;
var shootingStars=[];
var targetRotX=0,targetRotY=0,targetDist=60,currentDist=120;
var isDragging=false,prevMouse={x:0,y:0};
var entranceProgress=0,isEntrance=true;
var raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();

function init(){
clock=new THREE.Clock();
scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,.0015);
camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,3000);
camera.position.set(0,80,120);
renderer=new THREE.WebGLRenderer({antialias:!isMobile(),alpha:false,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000,1);
document.body.appendChild(renderer.domElement);

createGalaxy();
createBlackHole();
createNebulae();
createBackgroundStars();
createDust();
setupEvents();
animate();
hideLoading();
}

function hideLoading(){
setTimeout(function(){
document.getElementById('loading').classList.add('hidden');
document.getElementById('info').style.opacity='1';
setTimeout(function(){document.getElementById('info').style.opacity='.3';},8000);
},1500);}

// ===== GALAXY GENERATION =====
function createGalaxy(){
var positions=new Float32Array(STAR_COUNT*3);
var colors=new Float32Array(STAR_COUNT*3);
var sizes=new Float32Array(STAR_COUNT);
var radii=new Float32Array(STAR_COUNT);
var angles=new Float32Array(STAR_COUNT);
var offsets=new Float32Array(STAR_COUNT);
var branchAngles=new Float32Array(STAR_COUNT);

var colorInside=new THREE.Color(0xffd700); // Gold
var colorMid=new THREE.Color(0xb388ff); // Purple
var colorOutside=new THREE.Color(0x4fc3f7); // Blue

for(var i=0;i<STAR_COUNT;i++){
// Spiral parameters
var radius=Math.random()*Math.random()*40+2;
var branchAngle=(i%BRANCHES)/BRANCHES*Math.PI*2;
var spinAngle=radius*.35;
var randomX=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*.8*radius*.3;
var randomY=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*.5*radius*.2;
var randomZ=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*.8*radius*.3;

positions[i*3]=Math.cos(branchAngle+spinAngle)*radius+randomX;
positions[i*3+1]=randomY;
positions[i*3+2]=Math.sin(branchAngle+spinAngle)*radius+randomZ;

// Color gradient based on distance from center
var t=radius/42;
var mixedColor=colorInside.clone();
if(t<0.5){mixedColor.lerp(colorMid,t*2);}else{mixedColor.lerp(colorOutside,(t-.5)*2);}
mixedColor.offsetHSL((Math.random()-.5)*.05,(Math.random()-.5)*.1,0);
colors[i*3]=mixedColor.r;colors[i*3+1]=mixedColor.g;colors[i*3+2]=mixedColor.b;

sizes[i]=Math.random()*(isMobile()?.8:1.2)+.3;
radii[i]=radius;
angles[i]=branchAngle+spinAngle;
offsets[i]=Math.random()*.01+.005;
branchAngles[i]=branchAngle;}

var geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
geo.setAttribute('size',new THREE.BufferAttribute(sizes,1));

var mat=new THREE.PointsMaterial({
size:isMobile()?1.2:1.8,
vertexColors:true,
transparent:true,
opacity:.9,
blending:THREE.AdditiveBlending,
depthWrite:false});

galaxyPoints=new THREE.Points(geo,mat);
galaxyPoints.userData.radii=radii;
galaxyPoints.userData.angles=angles;
galaxyPoints.userData.offsets=offsets;
galaxyPoints.userData.branchAngles=branchAngles;
galaxyPoints.userData.positions=positions;
scene.add(galaxyPoints);
}

// ===== BLACK HOLE =====
function createBlackHole(){
// Core - pure black sphere
blackHoleCore=new THREE.Mesh(
new THREE.SphereGeometry(.8,16,16),
new THREE.MeshBasicMaterial({color:0x000000})
);
scene.add(blackHoleCore);

// Accretion disk
var diskGeo=new THREE.RingGeometry(1,4,64,8);
var diskMat=new THREE.MeshBasicMaterial({
color:0xffaa33,transparent:true,opacity:.6,
side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
blackHoleDisk=new THREE.Mesh(diskGeo,diskMat);
blackHoleDisk.rotation.x=Math.PI/2.5;
scene.add(blackHoleDisk);

// Glow sprite
var canvas=document.createElement('canvas');
canvas.width=canvas.height=128;
var ctx=canvas.getContext('2d');
var grad=ctx.createRadialGradient(64,64,0,64,64,64);
grad.addColorStop(0,'rgba(255,200,100,1)');
grad.addColorStop(.4,'rgba(255,150,50,.5)');
grad.addColorStop(1,'rgba(255,100,0,0)');
ctx.fillStyle=grad;ctx.fillRect(0,0,128,128);
var glowTex=new THREE.CanvasTexture(canvas);
glowSprite=new THREE.Sprite(new THREE.SpriteMaterial({
map:glowTex,color:0xffffff,transparent:true,opacity:.8,
blending:THREE.AdditiveBlending}));
glowSprite.scale.set(8,8,1);
scene.add(glowSprite);
}

// ===== NEBULAE =====
function createNebulae(){
var nebulaColors=[0x7c4dff,0xff6ec7,0x4fc3f7,0xe91e63,0xffd700];
for(var i=0;i<NEBULA_COUNT;i++){
var size=15+Math.random()*25;
var canvas=document.createElement('canvas');
canvas.width=canvas.height=256;
var ctx=canvas.getContext('2d');

// Create soft blob
for(var j=0;j<30;j++){
var x=128+(Math.random()-.5)*160;
var y=128+(Math.random()-.5)*160;
var r=20+Math.random()*60;
var c=nebulaColors[Math.floor(Math.random()*nebulaColors.length)];
var grad=ctx.createRadialGradient(x,y,0,x,y,r);
grad.addColorStop(0,'rgba('+hexToRgb(c)+',.08)');
grad.addColorStop(1,'rgba('+hexToRgb(c)+',0)');
ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}

var tex=new THREE.CanvasTexture(canvas);
var mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:.3+Math.random()*.2,depthWrite:false,side:THREE.DoubleSide});
var mesh=new THREE.Mesh(new THREE.PlaneGeometry(size,size),mat);
var angle=Math.random()*Math.PI*2;
var dist=10+Math.random()*30;
mesh.position.set(Math.cos(angle)*dist,(Math.random()-.5)*10,Math.sin(angle)*dist);
mesh.lookAt(camera.position);
mesh.userData.rotationSpeed=(Math.random()-.5)*.002;
nebulaMeshes.push(mesh);
scene.add(mesh);}
}

function hexToRgb(hex){var r=(hex>>16)&255,g=(hex>>8)&255,b=hex&255;return r+','+g+','+b;}

// ===== BACKGROUND STARS =====
function createBackgroundStars(){
var count=isMobile()?2000:5000;
var positions=new Float32Array(count*3);
for(var i=0;i<count;i++){
positions[i*3]=(Math.random()-.5)*600;
positions[i*3+1]=(Math.random()-.5)*600;
positions[i*3+2]=(Math.random()-.5)*600;}
var geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
var mat=new THREE.PointsMaterial({color:0xffffff,size:.5,transparent:true,opacity:.6});
scene.add(new THREE.Points(geo,mat));
}

// ===== DUST PARTICLES =====
function createDust(){
var count=isMobile()?500:1500;
for(var i=0;i<count;i++){
var geo=new THREE.BufferGeometry();
var pos=new Float32Array([ (Math.random()-.5)*200,(Math.random()-.5)*100,(Math.random()-.5)*200 ]);
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
var colors=[0xffffff,0xb388ff,0x4fc3f7,0xffd700];
var mat=new THREE.PointsMaterial({color:colors[Math.floor(Math.random()*4)],size:.15,transparent:true,opacity:.4,blending:THREE.AdditiveBlending});
var p=new THREE.Points(geo,mat);
p.userData={speed:(Math.random()-.5)*.02,rotSpeed:(Math.random()-.5)*.01};
floatingParticles.push(p);
scene.add(p);}
}

// ===== EVENTS =====
function setupEvents(){
var el=renderer.domElement;

// Mouse/Touch start
el.addEventListener('mousedown',onStart);
el.addEventListener('touchstart',onStart,{passive:true});

// Mouse/Touch move
el.addEventListener('mousemove',onMove);
el.addEventListener('touchmove',onMove,{passive:true});

// Mouse/Touch end
el.addEventListener('mouseup',onEnd);
el.addEventListener('touchend',onEnd);

// Wheel zoom
el.addEventListener('wheel',function(e){e.preventDefault();targetDist+=e.deltaY*.05;targetDist=Math.max(15,Math.min(250,targetDist));},{passive:false});

window.addEventListener('resize',function(){
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);});}

function onStart(e){
isDragging=true;
var t=e.touches?e.touches[0]:e;
prevMouse.x=t.clientX;prevMouse.y=t.clientY;}

function onMove(e){
var t=e.touches?e.touches[0]:e;
if(isDragging){
targetRotY+=(t.clientX-prevMouse.x)*.005;
targetRotX+=(t.clientY-prevMouse.y)*.005;
targetRotX=Math.max(-Math.PI/2.5,Math.min(Math.PI/2.5,targetRotX));}
prevMouse.x=t.clientX;prevMouse.y=t.clientY;}

function onEnd(e){
isDragging=false;
// Check for star click
if(e.type==='mouseup'||e.type==='touchend'){
var t=e.changedTouches?e.changedTouches[0]:e;
mouse.x=(t.clientX/innerWidth)*2-1;
mouse.y=-(t.clientY/innerHeight)*2+1;
raycaster.setFromCamera(mouse,camera);
// Simple star click effect
spawnShootingStar();}}

// ===== SHOOTING STARS =====
function spawnShootingStar(){
var geo=new THREE.BufferGeometry();
var startX=(Math.random()-.5)*200,startY=50+Math.random()*30,startZ=(Math.random()-.5)*100;
var endX=startX+(Math.random()-.5)*80,endY=startY-(20+Math.random()*20),endZ=startZ+(Math.random()-.5)*50;
geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([startX,startY,startZ,endX,endY,endZ]),3));
var mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:1,blending:THREE.AdditiveBlending});
var line=new THREE.Line(geo,mat);
line.userData.life=1;
shootingStars.push(line);
scene.add(line);}

setInterval(spawnShootingStar,SHOOTING_STAR_INTERVAL);

// ===== ANIMATION LOOP =====
function animate(){
requestAnimationFrame(animate);
var delta=clock.getDelta();
var elapsed=clock.getElapsedTime();

// Entrance animation
if(isEntrance){
entranceProgress+=delta*.5;
if(entranceProgress>=1){isEntrance=false;currentDist=targetDist;}
else{
var ease=1-Math.pow(1-entranceProgress,3);
currentDist=120-ease*(120-60);
camera.position.z=currentDist;
camera.position.y=80*(1-ease);
}}
else{
// Smooth camera follow
currentDist+=(targetDist-currentDist)*.05;
camera.position.z=currentDist;
}

camera.rotation.x+=(targetRotX-camera.rotation.x)*.08;
camera.rotation.y+=(targetRotY-camera.rotation.y)*.08;

// Galaxy rotation - smooth orbital motion
if(galaxyPoints){galaxyPoints.rotation.y += delta*.15;}

// Black hole effects
if(blackHoleDisk){blackHoleDisk.rotation.z+=delta*2;}
if(glowSprite){glowSprite.scale.setScalar(7+Math.sin(elapsed*3)*1.5);
glowSprite.material.opacity=.6+Math.sin(elapsed*3)*.2;}

// Nebula drift
nebulaMeshes.forEach(function(n){
n.rotation.z+=n.userData.rotationSpeed;
n.material.opacity=.25+Math.sin(elapsed*.5+n.position.x)*.1;});

// Dust particles
floatingParticles.forEach(function(p){
p.rotation.y+=p.userData.rotSpeed;
p.position.y+=Math.sin(elapsed+p.position.x)*.01;});

// Shooting stars fade
for(var i=shootingStars.length-1;i>=0;i--){
var s=shootingStars[i];
s.userData.life-=delta*1.5;
s.material.opacity=s.userData.life;
if(s.userData.life<=0){scene.remove(s);shootingStars.splice(i,1);}}

renderer.render(scene,camera);}

// Start
init();
</script>
</body>
</html>
